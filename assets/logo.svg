<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Album Sync: "AS" on #8032B0, the 50/50 blend of Flickr's blue (#0063DC) and pink (#FF0084).
       A circle on purpose: two letters in a rounded square is the scheme of Adobe's app icons. -->
  <circle cx="128" cy="128" r="128" fill="#8032B0"/>
  <text x="128" y="128" dy="0.36em" text-anchor="middle" fill="#FFFFFF"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="118"
        transform="translate(128 0) scale(1.08 1) translate(-128 0)">AS</text>
</svg>
